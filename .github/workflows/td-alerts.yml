name: TD alerts

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes, 2 minutes after each candle close (UTC)
  workflow_dispatch:                # lets you run it by hand from the Actions tab

permissions:
  contents: write                   # to save state.json (what's already been sent) back to the repo

concurrency:
  group: td-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan the markets and send alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 td_alerts.py --once
      - name: Remember what was sent
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "td-alerts"
            git config user.email "td-alerts@users.noreply.github.com"
            git add state.json
            git commit -m "Alert state"
            git push
          fi
